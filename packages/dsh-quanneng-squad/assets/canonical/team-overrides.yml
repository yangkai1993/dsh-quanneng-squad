# ── 宿主默认模型：不钉死任何 provider/model，跟随宿主 profile 当前路由 ──
# P15：任何模型都可以；bundle 只声明插件存在，不写死 provider/model。
# 用户当前模型由 profile 根 cordis.patch.yml 的 agent-default-model 块持有，install 覆盖时保留。
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config: {}
