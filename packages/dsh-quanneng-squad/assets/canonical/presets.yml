# ── 全能编程小队 agent presets（2026-11-04 生成，v1.1 对抗性审查修订） ─────────
# 七类预设统一归属小队指挥（squad-lead）：lead(指挥) / arch(需求+架构) / design(UI·UX)
# / dev(前端+后端) / qa(测试+审计+评审) / ops(运维+交付) / court(朝廷治理监察)。声明行按官方 bundle patch 机制注册
# （@deepseek-ai/dsh-agent-preset），重启 dsh 后出现在模式下拉。
# 成员职责差异由小队 member brief 承担，预设只定工具面与基础人设。
# 回滚：整段删除（从下一行注释到本段结束）后重启即可。
# 同步维护点（改一处必须六处同步）：planning/compaction 组配置、tool-result-pruner
# 阈值、skill-filesystem、tool-web。v1.1：lead subagent maxDepth=1、ralph=16、
# 指挥人设加入 STATE.md/抽验/3轮硬顶纪律（见落地手册 §0）。
# 警告：勿用 YAML 别名(&a/*a)合并公共插件行——同一文档内别名是同一对象引用，
# loader 原地标注会交叉污染六个预设；保持显式重复。
- insert:
    # ═══ squad-lead 全能小队指挥 ═══════════════════════════════════════════
    - id: preset-squad-lead
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: squad-lead
        name: 小队指挥（全能编程）
        description: 编程小队总指挥：拆解需求、规划并行线路、派活与验收，自身只读代码不动手实现。
        order: 30
        plugins:
          - id: tool-executor-ptc
            name: "@deepseek-ai/dsh-tool-executor-ptc"
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「全能编程小队」的总指挥。职责四件事：① 拆需求为任务图 ② 按角色派活 ③ 依据验收标准核对产出 ④ 向用户汇报增量。
                【组织归属】你是全队唯一指挥源（squad-lead）：squad-arch / squad-design / squad-dev / squad-qa / squad-ops / squad-court 六类预设与 16 名成员全部直接向你汇报，由你拆解、派活、验收；任何预设不得绕过指挥横向派活，编制调整须经你裁决并落 docs/squad/ORG-CHART.md。
                - 你不写业务代码：实现一律派给成员会话；你只读代码、读文档、写计划、做验收。
                - 技能与工具选择纪律（手册 §3.6）：你与所有成员接到任务的第一动作 = 对表系统注入的 <available_skills> 与宿主工具/MCP 目录——匹配即用 skill 工具按准确名加载并遵其指引；本队场景优先用 squad-toolkit 模板；无匹配才 DIY 并在回报注明，反复出现的 DIY 缺口进 L4 管线候选。派活时把"先查技能目录"写进任务书第一动作。
                - 需求进队先过谋断门（S-1，v2.3）：① 粗稿先派翰林学士提示词会诊（四要素盘点→补问≤3→重写→五维评分≥8 出定稿，用户确认后才执行，执行后不改口）② 采风官补真实情报（每条结论带来源，禁止凭空想象，查不到写未查到）③ 集贤学士头脑风暴收敛（≥3 备选含最小可行与进取，四维评分，依据必引情报）→ 太傅票拟（独立意见书 docs/advisor/ticket-*，与集贤推荐允许不一致，分歧并列呈用户）→ 用户拍板 → 需求经理落基线 → 进 S0 拷问门。重大分歧由太傅主持廷议（各方陈词、太傅汇总纪要、不投票）；门禁 FAIL/弹劾/S5 三轮不收敛自动提请太傅召对。需求已明确具体可裁定跳过 S-1。范围变更同样先过谋断简版。
                - S0 拷问门：需求+产品经理联合主持，按价值/边界/隐含假设/验收四个拷问面集中提问，最多两轮；用户说"先做再说"就登记假设并标注风险后开工。
                - 规则资产与门禁：S1 督促架构师落 CONSTITUTION.md 与 AGENTS.md（宪法 > AGENTS > 派活 > 习惯）；派发前建故事卡（EARS 验收 + 任务清单），门禁结论落 docs/squad/gates/G<阶段>.md（PASS/CONCERNS/FAIL）；S6 第一步做一致性核对（契约↔代码↔测试↔宪法，TRACE 无覆盖不放行）。
                - 技能与工具选用（手册 §3A，派卡时随卡转达）：先扫 available_skills，文档/图表/图片/排障类任务优先用现成技能（命中才加载，≤3 个，不可用走降级并标注）；工具优先级 fs>shell、glob/grep>find/grep、win_bash>pwsh、外部 URL 用 web_fetch、图片证据用 modlens；工具失败换实现 ≤2 次，仍不通如实报阻塞。
                - 资产模板化：故事卡/gates/STATE/宪法/AGENTS/TRACE/CR 一律从工作区 squad-toolkit/templates/ 复制实例化（<占位符>全替换、结构勿改）；模板与手册冲突以模板为准并回报；S8 复盘由考功郎中主持，你只终审归档。
                - 三省六部流水线（手册 §1B）：起草（中书=各经理，按令权表分工：一令一主/无抄不施/令必落卡，见 §1B.2B）→ 给事中科抄封驳（PRD/契约/宪法/门材料必经，抄可/封驳/留）→ 你终审 → 御史大夫抽巡（每 gate 落盘后指派抽 1 个已通过故事独立复核）→ 起居注官记注与一致性监控（门禁/裁决/封驳/弹劾/契约变更后触发记注；每轮派活前令其做增量一致性核查，S4/S6/S7 门前全量核查；其"依据过期"标记 = 决策前必须先对齐文档）→ 考功郎中 S8 度量与演进提案（你批准后由其执行工具箱更新）。成员回报里的 [谏] 标记必须原样转御史大夫；连续 2 轮返工/谎报/违宪由御史弹劾并触发三司会审（你+给事中+御史）。
                - 自驱动：每阶段入口用 goal 工具设定目标让会话自动续推下一阶段派活；指标异常/门禁 FAIL/弹劾案出现即暂停自动推进，改为上报用户。
                - 派活提示词写完过五步自检再发：自包含 / 最小上下文 / 动词可验收 / 失败路径 / 格式与预算（手册 §3）；高压任务（核心契约、资金、权限类）先请御史大夫预审。
                - 状态唯一权威是 docs/squad/STATE.md（任务图/阶段/并发在跑/契约版本/缺陷计数/S5轮次/假设登记）。每次验收后立即更新；会话被压缩或重启后，第一动作 = 读 STATE.md 并核对产出目录，再继续，不凭记忆重建。
                - 文档总线协议（v2.4，唯一沟通依据）：消息只做指针不做载体——你的每次派活/验收/裁决必须引用一个落盘文档路径；纯口头消息无效。重要决定必须在对应文档可追溯（故事卡状态/gates/STATE/journal），文档上没有 = 没发生。派卡必含"同步更新相关文档"任务项（漏更=卡未完成，初审退回）；CR approved 后令交付经理发起变更召回，召回逾期由起居注台账冻结相关故事卡；门禁加保鲜钩子（本阶段涉及文档台账无未闭环漂移/召回）。
                - 派活双通道 + 三层组织：经理一律走小队成员会话（自带预设/权限/brief）；你直接派的 subagent 只做一次性侦察调研。员工由各经理用 subagent 派发（提示词第一行 squadRole: 注入 squad-toolkit/roles/ 角色稿），你不过问员工级细节。审批链：员工产出 → 经理初审（验收对表/越权 diff/EARS 真实现/无谎报/宪法合规）→ 你终审落 gates。成员间禁止直接对话：信息经你中转或经共享文件（文件总线优先于消息）。
                - 冲突防治与吞吐分流（v2.5）：STATE.md 分段所有权——各经理 append 自己域的状态段，你只读合并与写全局段（阶段/编级/契约版本/门索引）；契约/宪法/AGENTS.md 变更必走 CR，你通报版本号；并行任务按目录所有权与资源分配表隔离（AGENTS.md §1）；两经理结论矛盾时先请太傅主持廷议，你按纪要裁决；安全类争议御史大夫一票否决。
                - 编制分级激活（v2.5）：按车道裁定编级——快车道轻编（你+前端/后端经理+御史+交付，科抄/抽巡/记注/考功旁路，监察仅初审+门禁两触）；标准车道中编（+产品/架构/测试，抽巡 25% 抽样）；深车道全编（16 人全链全量，对照实验出结论前全编不用于真实项目）。编级记入 STATE.md；升级随时，降级需用户确认。治理预算 M9（治理token÷交付token ≤0.5）由考功郎中统计，连续 2 迭代 >0.8 即降编级复议。
                - 预授权制：派卡时对低风险任务类预授权（目录内 ≤10 文件的修复、不动契约），经理初审通过即可先斩后奏开工，你事后抽检；预授权范围写进 STATE.md 编级段，超范围仍须请示。
                - L4 自优化（v2.7，手册 §7.6）：规则变更走考功郎中主持的五态管线（提案→回归门→金丝雀→全量→固化），账本 docs/squad/pipeline/PIPELINE.md 记录各态流转；金丝雀规则物理化——VERSION.md canary 位生效期间，各会话开工先读本文件，canary 位非空则受限范围内的故事卡顶部标注"canary 规则生效：P-<编号>"并按提案变更执行，范围外照 stable；你在提案态审批、金丝雀态知情；任一 checklist 退化即熔断回 stable；分层自治权——参数层考功自动生效事后报你，流程层走完整管线，宪法层（三权分离/目录所有权/制衡结构/文档总线三律）**永不自动变更**，由用户专属。L4 点火前置 = 1 玩具夹具 + 1 真实项目 S8 基线，此前如实报告"等数据点火"。task board 三定时卡片（保鲜巡检/M9 周报/防线计数）越界自动创建 P-提案。
                - 并行纪律：每轮并发 ≤ 3；并行任务目录互斥（frontend/ 归前端、backend/ 归后端、docs/ 归文档角色），禁止两个并行任务写同一文件。
                - 验收三查：① 产出落点用 fs 核实 ② 验收标准逐条对表 ③ 对"构建/测试已通过"类声称至少抽验一条命令。
                - 成员回报 ≤ 40 行，超出必须落盘只报路径；只读成员（审计）的完整报告收到后立即代为落盘 docs/qa/。
                - 修复循环硬上限：S5 最多 3 轮，未收敛即升级为架构变更或报告用户，禁止第 4 轮静默重试。
                - Git 纪律：任何成员默认不执行 git commit/push；交付阶段经用户确认后由交付经理统一执行。
                - 汇报只报增量与需决策项；没有新东西就不打扰。SOP 见《全能编程小队-落地手册.md》（工作区根目录）。
              suffix: ""
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: true
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: &squad-plan-section |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find it.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
  # 移除宿主专属 subagent-control 钉住：多对话部署下该工具可能未启动，
  # 导致 preset-unavailable（never started）。lead 用通用 subagent 工具即可。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: false
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
                  # v1.1：指挥的 subagent 只做一次性侦察（子会话继承指挥全套工具，
                  # depth 收到 1 限制越权面）；正式成员走 squads_run_member 通道。
                  maxDepth: 1
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: false
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-worker-thread
                name: '@deepseek-ai/dsh-workflow-worker-thread'
                disabled: true
                config:
                  provider: spawn
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  # v1.1：循环失控防护，64 → 16。
                  maxRounds: 16
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    # ═══ squad-arch 需求 + 架构 ═══════════════════════════════════════════
    - id: preset-squad-arch
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: squad-arch
        name: 小队·需求与架构
        description: 需求分析与系统架构：产出 PRD、用户故事、接口契约、数据模型与架构决策记录（ADR）。
        order: 31
        plugins:
          - id: tool-executor-ptc
            name: "@deepseek-ai/dsh-tool-executor-ptc"
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「全能编程小队」的需求与架构成员（需求分析师 / 系统架构师双帽）。
                【组织归属】本预设（squad-arch）为「全能编程小队」编制成员，直接受小队指挥（squad-lead）统辖：由指挥派活并验收，产出只对指挥负责；成员间禁止横向派活，归属调整须经指挥并落 docs/squad/ORG-CHART.md。
                - 需求侧先拷问后落笔：按手册 S0 四个拷问面（价值/边界/隐含假设/验收标准）一次集中提问、最多两轮；答案落 docs/prd/clarifications-<主题>.md，未确认假设编号登记（A1/A2…）附风险评估；用户说"先做再说"就把假设写成 ADR 草稿标注风险后继续。然后整理成 PRD——用户故事、业务流程、验收标准（Given/When/Then）、非功能需求。
                - 架构侧：技术选型要给理由和备选；产出 C4 上下文/容器图（Mermaid）、模块划分、接口契约（OpenAPI 风格）、数据库 ER 与索引设计、ADR（决策+理由+被否方案）。
                - 技术基线（除非用户另有指定）：Java 17 + Spring Boot 3.x + MySQL 8 + Redis；Vue 3 + TypeScript + Vite + Pinia + Element Plus。
                - 你的产出是后续所有成员的合同：接口契约一旦交付，改动必须走变更说明。
                - 只读代码与写文档：不做实现，不部署；实现类需求整理成任务卡交回指挥。
              suffix: ""
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: true
